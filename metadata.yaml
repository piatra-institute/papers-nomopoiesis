abstract: |-
  An ordinary dynamical system moves a state under a rule that stands still. Many of the systems that carry the weight of biology and society do the other thing: they edit the rule as they run. A population reshapes the environment that selects it, a colony lays trails that redraw who can reach whom, a market invents instruments that change what a trade is. This paper names that process nomopoiesis, from nomos (established law or custom) and poiesis (making), and gives it a formal object: a system carries an ordinary state and a law parameter that its own trajectory edits, so that one equation is change under a law and the other is change of the law. It counts as genuinely nomopoietic only when a causal path runs from the state now, through the law, to the state later, which excludes systems whose rule is turned by an outside clock. The obvious objection, that the enlarged state-plus-law is just a bigger ordinary system, is granted in form and answered by a typed distinction between object-level and rule-level variables; the strong cases, where the reachable dimension, admissible variables, interaction topology, or action alphabet change, resist the flattening in content. A depth of parametric, structural, or generative orders the cases. Niche construction is the worked instance: life rarely rewrites physics (the beaver does not amend fluid mechanics) but routinely writes a local law inside it, since the dam resets boundaries, flow, transport cost, and the selection the beaver's descendants will meet, so niche construction is ecological nomopoiesis. A minimal deterministic simulation makes four consequences concrete and checkable. The derivative of long-run fitness splits into a direct term and a niche-mediated term whose signs can oppose, so a trait deleterious at fixed environment becomes favoured once the environment it builds is counted, the analytic split matching a finite-difference of the constructed equilibrium. Ecological inheritance is an impulse-response kernel whose persistence sets a threshold, a costly constructor here favoured only above an environmental persistence of 0.68. A nomopoietic gain separates a state-edited law, where a one-off action compounds to 4.5 times its initial trajectory effect, from an externally forced twin, where it decays to nothing. And a replicator game whose payoff matrix is written by play sustains a cooperation-defection oscillation of amplitude 0.95 that every frozen game forbids. The claim is that evolution is not only motion across a landscape but the endogenous editing of the landscape's rules, and that this is a testable structural property rather than a metaphor.
