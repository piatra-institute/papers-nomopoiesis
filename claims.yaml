- id: def-nomopoiesis
  kind: definition
  passage: We call the operator, and the process it runs, nomopoiesis.
  rationale: Names the law-editing operator N in x_{t+1} = F_{lambda_t}(x_t), lambda_{t+1} = N(lambda_t,
    x_t).
- id: def-criterion
  kind: definition
  passage: A system is nomopoietic when there is a nontrivial path
  rationale: The causal criterion x_t -> lambda_{t+1} -> x_{t+k}; it excludes externally clocked laws
    and is the paper's central definition.
- id: def-depths
  kind: definition
  passage: The cases can be ordered by what is rewritten.
  rationale: Introduces parametric, structural and generative depths of nomopoiesis; a classification,
    not an empirical claim.
- id: def-fitness
  kind: assumption
  passage: Fitness is accordingly defined as the long-run invasion growth rate of a rare type in the environment
    set by a resident, a lineage-growth quantity with no implication that organisms maximize a utility
    [@metz1992].
  rationale: Adopts invasion fitness as the currency; the selection results depend on it.
- id: flattening
  kind: interpretation
  passage: Reading $(x,\lambda) = H(\cdot)$ as one flat system is permissible, but it deletes the difference
    between a position and the law of motion for positions, which the model is built to track.
  rationale: Concedes that the construction is formally an enlarged autonomous system and locates the
    content of the concept in typing and causal asymmetry.
- id: models-illustrative
  kind: assumption
  passage: None is fit to data, and every number reported is a key in the accompanying `results.json`.
  rationale: The four models are stipulated and deterministic; their numbers test the consistency of the
    definitions and carry no empirical weight.
- id: magnitudes
  kind: assumption
  passage: The sign reversal and the persistence threshold follow from the chosen functional forms, and
    their magnitudes carry no empirical weight.
  rationale: Scope limit on Section 6.
- id: fragile-cycle
  kind: interpretation
  passage: 'The game oscillation is a neutral cycle whose amplitude depends on the initial condition,
    and it is structurally fragile: noise or dissipation that breaks the conserved quantity can turn it
    into a spiral or a limit cycle.'
  rationale: Follows from the conserved quantity reported in Section 6; not simulated with noise.
- id: ecological-nomopoiesis
  kind: interpretation
  passage: 'In this sense niche construction is ecological nomopoiesis: organisms write local law within
    fixed physical law.'
  rationale: The paper's central interpretive identification.
- id: src-laland
  kind: source
  passage: That a constructed environment feeds back into selection, fixing otherwise deleterious alleles
    and creating or removing polymorphisms, is the founding formal result of niche-construction theory
    [@laland1999], and the reach of a constructor's effect beyond its own body is the extended phenotype
    [@dawkins1982].
  evidence:
    citation_id: laland1999
    locator: Abstract
    verified: true
    verification_note: DOI 10.1073/pnas.96.18.10242; the Crossref abstract reports that niche construction
      can fix otherwise deleterious alleles, support stable polymorphisms where none are expected and
      eliminate otherwise stable polymorphisms. Bound for the laland1999 clause.
- id: src-lehmann
  kind: source
  passage: which records the strength, sign, delay and generational reach of a construction [@lehmann2008].
  evidence:
    citation_id: lehmann2008
    locator: Abstract
    verified: true
    verification_note: 'DOI 10.1111/j.1558-5646.2007.00291.x; abstract (OpenAlex): inclusive-fitness analysis
      of niche-constructing traits whose effects extend beyond the actor''s life span and reach future
      individuals likely to share the actor''s lineage, with present benefits traded off against future
      ones.'
