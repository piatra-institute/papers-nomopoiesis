- id: src-wong
  kind: source
  passage: At depth three, evolution changes the set of problems a lineage faces in addition to solving
    problems within a fixed set; recent work on functional information attempts to quantify this expansion
    of possibility under selection for function [@wong2023].
  evidence:
    citation_id: wong2023
    locator: Abstract
    verified: true
    verification_note: DOI 10.1073/pnas.2310223120; the Crossref abstract proposes a law of increasing
      functional information under selection for function, with novelty generation as a concept of selection.
- id: src-gross
  kind: source
  passage: When the edited object is an interaction graph, the same picture applies to adaptive networks,
    in which node states and topology coevolve and adding or cutting an edge creates or destroys a feasible
    transition [@gross2008].
  evidence:
    citation_id: gross2008
    locator: Abstract
    verified: true
    verification_note: DOI 10.1098/rsif.2007.1229; the Crossref abstract describes adaptive networks as
      combining topological evolution with node dynamics.
- id: src-constant
  kind: source
  passage: A variational free-energy account of the same organism-environment loop has been developed
    within active inference; it is useful for perception-action coupling and is one available formulation
    among several [@constant2018].
  evidence:
    citation_id: constant2018
    locator: Abstract
    verified: true
    verification_note: DOI 10.1098/rsif.2017.0685; the Crossref abstract argues that niche construction
      can be described with the variational free-energy approach.
- id: src-ghani
  kind: source
  passage: A constructor is a lens, a forward map that acts on the environment paired with a backward
    map that returns altered constraints and selection pressures, and lenses compose along shared interfaces
    in a symmetric monoidal category [@ghani2018].
  evidence:
    citation_id: ghani2018
    locator: Abstract
    verified: true
    verification_note: 'DOI 10.1145/3209108.3209165; abstract (OpenAlex): open games are morphisms of
      a symmetric monoidal category, composed sequentially and in parallel, played relative to an environment.'
- id: src-laio
  kind: source
  passage: Metadynamics in molecular simulation is an enhanced-sampling method for escaping free-energy
    minima [@laio2002]; it shares a stem with the present term and is otherwise unrelated.
  evidence:
    citation_id: laio2002
    locator: Abstract
    verified: true
    verification_note: DOI 10.1073/pnas.202427399; the Crossref abstract describes a history-dependent
