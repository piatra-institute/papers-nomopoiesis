claims:
- id: abs-direct
  kind: computation
  passage: In four deterministic models, a trait with direct selection gradient $-0.6$ has a total gradient
    of $+5.4$ once the environment it builds is counted; a costly constructor is favoured only above an
    environmental persistence of $0.68$; a one-off action under a state-edited law grows to $4.5$ times
    its initial effect after forty steps, while in an externally forced twin with the same law time-course
    it decays below $10^{-11}$; and a replicator game whose payoff matrix is written by play sustains
    cooperation cycles of amplitude $0.95$, whereas every frozen game fixates or, at one neutral environment,
    stays put.
  evidence:
    file: simulation/output/results.json
    run_id: nomopoiesis
    pointer: /selection_decomposition/direct_gradient
    reported: '-0.6'
    decimals: 1
    units: direct selection gradient dw/dtheta at fixed environment
    conditions: 'coupled trait-environment model: cost 0.5, benefit 1.2, rho 0.8, kappa 1.0, resident
      theta 0.6'
